<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HydroPro Tracker</title>
  <meta name="description" content="Personal daily water, protein, and calorie tracker" />

  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HydroPro" />

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" href="icons/favicon-32.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <style>
    html, body, #root { margin: 0; padding: 0; min-height: 100%; }
    body { background: #0B0F14; }

    #wt-boot { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: #0B0F14; transition: opacity .2s ease; }
    #wt-boot.wt-boot-hide { opacity: 0; pointer-events: none; }
    #wt-boot img { width: 120px; height: 120px; will-change: transform; animation: wt-boot-spin .9s cubic-bezier(.3, 0, .2, 1) 1 forwards; }
    @keyframes wt-boot-spin { from { transform: rotate(0deg); } to { transform: rotate(720deg); } }
    @media (prefers-reduced-motion: reduce) {
      #wt-boot img { animation: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="wt-boot"><img src="gauges/main-logo.png" alt="" /></div>
  <script>
    setTimeout(function () {
      var b = document.getElementById('wt-boot');
      if (!b) return;
      b.classList.add('wt-boot-hide');
      setTimeout(function () { b.remove(); }, 250);
    }, 950);
  </script>

  <script src="config.js?v=2"></script>
  <script src="bundle.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
