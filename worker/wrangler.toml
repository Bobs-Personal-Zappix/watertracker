name = "water-tracker-push"
main = "src/worker.js"
compatibility_date = "2026-01-01"

# Every 15 minutes. Cloudflare cron runs in UTC; the Worker itself converts
# to each subscriber's saved timezone before deciding whether to send.
[triggers]
crons = ["*/15 * * * *"]

# Create with: wrangler kv namespace create water-tracker-kv
# then paste the id it prints below.
[[kv_namespaces]]
binding = "WATER_KV"
id = "40e3319e7b504939a6cceb722b5d1448"

[[d1_databases]]
binding = "DB"
database_name = "hydropro-db"
database_id = "476d5b17-f469-4a88-bdfe-50dff6dba624"

# Public key and contact email are not secret - safe to commit.
# VAPID_PRIVATE_KEY is the one real secret - set with `wrangler secret put`, see README.
[vars]
VAPID_PUBLIC_KEY = "BP6tTbRxaHf0AHevCIdKZp187h1kiPMNBiH2Wvvv_iqtbdUsc6Em7XwVnSXZxmQYbo9bLCSXmQ5XneSUtBXICKo"
VAPID_CONTACT_EMAIL = "mailto:rob@hydroprotracker.com"
